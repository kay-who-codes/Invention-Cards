<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🪄 Dope Inventions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <div id="header"></div>
    <div class="container">
        <!-- Loading Screen -->
        <div id="loading-screen">
            <h1>🪄 Dope Inventions</h1>
            <p class="loading">Loading cards...</p>
        </div>

        <!-- Role Selection -->
        <div id="role-selection-screen" class="hidden">
            <h1>Dope Inventions</h1>
            <h2>Choose your role:</h2>
            <div class="card-row">
                <div class="card" id="buyer-card">
                    <h4>Buyer</h4>
                    <h2></h2>
                </div>
                <div class="card" id="entrepreneur-card">
                    <h4>Entrepreneur</h4>
                    <h2></h2>
                </div>
            </div>
        </div>

        <!-- Buyer Screen -->
        <div id="buyer-screen" class="hidden">
            <h1>Buyer Prompt</h1>
            <div class="card">
                <h3>Your Character:</h3>
                <h2 id="buyer-prompt"></h2>
            </div>
            <div class="button-container">
                <button id="back-to-role">Choose Another Role</button>
            </div>
        </div>

        <!-- Entrepreneur Screen -->
        <div id="entrepreneur-screen" class="hidden">
            <h1>Create Your Product</h1>
            <p>Select 3 cards from the options below:</p>
            <div class="card-grid" id="entrepreneur-cards"></div>
            <div class="button-container">
                <button id="finalize-choices" disabled>Finalize Choices (0/3)</button>
                <button id="back-to-role-from-entrepreneur">Choose Another Role</button>
            </div>
        </div>

        <!-- Entrepreneur Final Selection -->
        <div id="entrepreneur-final-screen" class="hidden">
            <h1>Your Product</h1>
            <p>Combine these to create your pitch:</p>
            <div class="card-row" id="final-selection"></div>
            <div class="button-container">
                <button id="back-to-entrepreneur">Choose Different Cards</button>
                <button id="back-to-role-from-final">Choose Another Role</button>
            </div>
        </div>
    </div>
</body>
<script src="js/app.js"></script>
<script src="js/header.js"></script>
</html>
